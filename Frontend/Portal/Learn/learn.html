<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="author" content="Create Hub Ghana" />
    <meta
      name="description"
      content="Study & Learn — Access curated educational resources on pan-Africanism, technology, financial literacy, and programming designed to empower African youth." />
    <meta
      name="keywords"
      content="Create Hub Ghana, Study, Learn, Resources, Education, Pan-Africanism, Technology, Financial Literacy, Programming, Youth Empowerment" />
    <meta name="theme-color" content="#1a237e" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Social -->
    <meta property="og:site_name" content="Create Hub Ghana" />
    <meta property="og:title" content="Study & Learn — Create Hub Ghana" />
    <meta
      property="og:description"
      content="Explore educational resources on pan-Africanism, technology, financial literacy, and programming for African youth." />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="../../Universal/Images/CreateHubGhana_Logo.png" />
    <meta property="og:url" content="https://createhubghana.org/study" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Study & Learn — Create Hub Ghana" />
    <meta
      name="twitter:description"
      content="Access curated educational resources to empower the next generation of African youth." />
    <meta
      name="twitter:image"
      content="../../Universal/Images/CreateHubGhana_Logo.png" />

    <title>CHG — Learn</title>

    <!-- Styles -->
    <link rel="stylesheet" href="../../Portal/Learn/learn.css" />
    <link rel="stylesheet" href="../../Universal/styles.css" />

    <!-- Favicon -->
    <link
      rel="shortcut icon"
      type="image/png"
      href="../../Universal/Images/CreateHubGhana_Logo.png" />

    <!-- Structured data for study resources listing (basic) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebPage",
        "name": "Study & Learn — Create Hub Ghana",
        "description": "Curated educational resources on pan-Africanism, technology, financial literacy, and programming for African youth."
      }
    </script>
  </head>
  <body>
    <nav id="navbar">
      <div class="nav-logo-container">
        <img src="../Universal/Images/CreateHubGhana_Logo.png" alt="CHG Logo" />
      </div>

      <span class="logo-text-container">CREATE Hub Ghana</span>

      <div class="nav-btn-container">
        <button class="nav-btn">Home</button>
        <button class="nav-btn">Services</button>
        <!-- <button class="nav-btn selected">Programs</button> -->
        <button class="nav-btn selected">Learn</button>
        <button class="nav-btn">Blog</button>
        <button class="nav-btn">About</button>
        <button class="nav-btn">Contact</button>
      </div>

      <button class="donate">Support Us</button>

      <button
        type="button"
        role="button"
        class="menu-btn"
        aria-expanded="false"
        aria-controls="navbar"
        aria-label="Toggle navigation menu">
        <img src="../../Universal/Icons/menu_black.svg" alt="Menu Icon" />
      </button>

      <div class="menu-container">
        <div class="m-btn-container">
          <button class="m-btn" id="home-m-btn">
            <span>Home</span>
          </button>
          <button class="m-btn" id="services-m-btn">
            <span>Services</span>
          </button>
          <!-- <button class="m-btn selected" id="programs-m-btn">
            <span>Programs</span>
          </button> -->
          <button class="m-btn selected" id="learn-m-btn">
            <span>Learn</span>
          </button>
          <button class="m-btn" id="blog-m-btn"><span>Blog</span></button>
          <button class="m-btn" id="about-m-btn"><span>About</span></button>
          <button class="m-btn" id="contact-m-btn"><span>Contact</span></button>
        </div>
      </div>
    </nav>
  </body>
  <script src="../../Portal/Learn/learn.js" defer></script>
  <script src="../../Global/global-script.js" defer></script>
</html>
