<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="author" content="Create Hub Ghana" />
    <meta
      name="description"
      content="Programs & Projects — Create Hub Ghana runs education, mentorship and tech-for-good projects that empower youth with STEM, AI and digital skills. Explore our current programs, impact stories and how to get involved." />
    <meta
      name="keywords"
      content="Create Hub Ghana, Programs, Projects, STEM, AI, youth empowerment, mentorship, digital skills, community projects" />
    <meta name="theme-color" content="#1a237e" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Social -->
    <meta property="og:site_name" content="Create Hub Ghana" />
    <meta
      property="og:title"
      content="Programs & Projects — Create Hub Ghana" />
    <meta
      property="og:description"
      content="Discover Create Hub Ghana's programs and projects that build digital skills, foster innovation and create community impact across Ghana." />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="../../Universal/Images/CreateHubGhana_Logo.png" />
    <meta property="og:url" content="https://createhubghana.org/programs" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Programs & Projects — Create Hub Ghana" />
    <meta
      name="twitter:description"
      content="Explore our programs, workshops and community projects designed to empower the next generation of tech leaders in Ghana." />
    <meta
      name="twitter:image"
      content="../../Universal/Images/CreateHubGhana_Logo.png" />

    <title>CHG — Programs & Projects</title>

    <!-- Styles -->
    <link rel="stylesheet" href="../../Portal/Programs/programs.css" />
    <link rel="stylesheet" href="../../Universal/styles.css" />

    <!-- Favicon -->
    <link
      rel="shortcut icon"
      type="image/png"
      href="../../Universal/Images/CreateHubGhana_Logo.png" />

    <!-- Structured data for programs listing (basic) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebPage",
        "name": "Programs & Projects — Create Hub Ghana",
        "description": "Programs and projects by Create Hub Ghana focused on STEM education, AI literacy and youth empowerment."
      }
    </script>
  </head>
  <body>
    <nav id="navbar">
      <div class="nav-logo-container">
        <img src="../Universal/Images/CreateHubGhana_Logo.png" alt="CHG Logo" />
      </div>

      <span class="logo-text-container">CREATE Hub Ghana</span>

      <div class="nav-btn-container">
        <button class="nav-btn">Home</button>
        <button class="nav-btn">Services</button>
        <button class="nav-btn selected">Programs</button>
        <button class="nav-btn">Blog</button>
        <button class="nav-btn">About</button>
        <button class="nav-btn">Contact</button>
      </div>

      <button class="donate">Support Us</button>

      <button
        type="button"
        role="button"
        class="menu-btn"
        aria-expanded="false"
        aria-controls="navbar"
        aria-label="Toggle navigation menu">
        <img src="../../Universal/Icons/menu_black.svg" alt="Menu Icon" />
      </button>

      <div class="menu-container">
        <div class="m-btn-container">
          <button class="m-btn" id="home-m-btn">
            <span>Home</span>
          </button>
          <button class="m-btn" id="services-m-btn">
            <span>Services</span>
          </button>
          <button class="m-btn selected" id="programs-m-btn">
            <span>Programs</span>
          </button>
          <button class="m-btn" id="vlog-m-btn"><span>Vlog</span></button>
          <button class="m-btn" id="about-m-btn"><span>About</span></button>
          <button class="m-btn" id="contact-m-btn"><span>Contact</span></button>
        </div>
      </div>
    </nav>
  </body>
  <script src="../../Portal/Programs/programs.js" defer></script>
  <script src="../../Global/global-script.js" defer></script>
</html>
